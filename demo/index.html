<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>web-sonifier demo</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 1.5rem;
      padding: 2rem 1rem 4rem 1rem;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 500;
      color: #fff;
      letter-spacing: 0.05em;
    }

    .card {
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 14px;
      padding: 1.5rem 1.75rem;
      width: 100%;
      max-width: 580px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    }

    /* Top transport & volume bar */
    .transport-bar {
      display: flex;
      gap: 0.6rem;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    button {
      padding: 0.55rem 1rem;
      border: none;
      border-radius: 8px;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-play { background: #4caf82; color: #000; font-weight: 600; flex: 1.2; }
    .btn-play:not(:disabled):hover { background: #5bc493; }
    .btn-stop { background: #333745; color: #fff; flex: 1; }
    .btn-stop:not(:disabled):hover { background: #3f4455; }

    .status-badge {
      font-size: 0.78rem;
      color: #888;
      background: #0f1117;
      border: 1px solid #2a2d3a;
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .status-badge.active {
      color: #4caf82;
      border-color: rgba(76, 175, 130, 0.4);
    }

    /* Master volume row */
    .volume-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      background: #13151f;
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      border: 1px solid #232635;
    }

    .volume-row label {
      font-size: 0.82rem;
      color: #888;
      white-space: nowrap;
      min-width: 5.5rem;
    }

    input[type=range] {
      flex: 1;
      accent-color: #4caf82;
      cursor: pointer;
    }

    .volume-row .vol-value {
      font-size: 0.85rem;
      color: #ccc;
      width: 2.5rem;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    /* Sonifier selector row */
    .sonifier-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid #2a2d3a;
      flex-wrap: wrap;
    }

    .sonifier-select-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex: 1;
    }

    .sonifier-select-group label {
      font-size: 0.85rem;
      color: #aaa;
      white-space: nowrap;
    }

    select {
      background: #0f1117;
      border: 1px solid #2a2d3a;
      border-radius: 6px;
      color: #fff;
      padding: 0.4rem 0.6rem;
      font-size: 0.85rem;
      cursor: pointer;
    }

    select:focus, input:focus {
      outline: none;
      border-color: #4caf82;
    }

    .feed-rate-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .feed-rate-group label {
      font-size: 0.82rem;
      color: #777;
    }

    /* Parameters section */
    .parameters-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.85rem;
    }

    .parameters-header h2 {
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.04em;
    }

    .parameters-header .hint {
      font-size: 0.75rem;
      color: #777;
    }

    .parameters-container {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    /* Individual parameter card */
    .param-card {
      background: #13151f;
      border: 1px solid #232635;
      border-radius: 10px;
      padding: 0.75rem 0.9rem;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .param-card:hover {
      border-color: #33384c;
    }

    .param-card.sonified {
      border-color: rgba(76, 175, 130, 0.35);
      background: #141822;
    }

    .param-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
      gap: 0.5rem;
    }

    .param-toggle-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 500;
      color: #ddd;
      user-select: none;
    }

    .param-toggle-label input[type=checkbox] {
      accent-color: #4caf82;
      width: 1rem;
      height: 1rem;
      cursor: pointer;
    }

    .param-readouts {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
    }

    .param-feed-badge {
      background: rgba(76, 175, 130, 0.15);
      border: 1px solid rgba(76, 175, 130, 0.35);
      color: #4caf82;
      border-radius: 5px;
      padding: 0.15rem 0.45rem;
      font-size: 0.78rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .badge-static {
      background: #0f1117;
      border: 1px solid #2a2d3a;
      color: #aaa;
      border-radius: 5px;
      padding: 0.15rem 0.45rem;
      font-size: 0.8rem;
      font-variant-numeric: tabular-nums;
    }

    .badge-range {
      background: #0f1117;
      border: 1px solid #2a2d3a;
      color: #4caf82;
      font-weight: 600;
      border-radius: 5px;
      padding: 0.15rem 0.45rem;
      font-size: 0.8rem;
      font-variant-numeric: tabular-nums;
    }

    /* Single slider wrapper */
    .single-slider-wrapper {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.15rem 0;
    }

    .single-slider-wrapper input[type=range] {
      flex: 1;
      height: 24px;
    }

    /* Dual range slider */
    .dual-range-wrapper {
      position: relative;
      width: 100%;
      height: 32px;
      display: flex;
      align-items: center;
    }

    .dual-range-track {
      position: absolute;
      left: 0;
      right: 0;
      height: 8px;
      background: #0f1117;
      border: 1px solid #2a2d3a;
      border-radius: 4px;
      z-index: 1;
    }

    .dual-range-progress {
      position: absolute;
      height: 100%;
      background: #4caf82;
      border-radius: 4px;
      cursor: grab;
      touch-action: none;
      pointer-events: auto;
      z-index: 2;
    }

    .dual-range-progress::before {
      content: '';
      position: absolute;
      top: -10px;
      bottom: -10px;
      left: 0;
      right: 0;
    }

    .dual-range-progress:active {
      cursor: grabbing;
      background: #6fcf9f;
    }

    .dual-range-input {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 32px;
      margin: 0;
      background: none;
      pointer-events: none;
      -webkit-appearance: none;
      appearance: none;
      z-index: 3;
    }

    .dual-range-input::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #4caf82;
      cursor: ew-resize;
      pointer-events: auto;
      border: 2px solid #0f1117;
      box-shadow: 0 0 5px rgba(0,0,0,0.6);
      transition: transform 0.1s ease;
    }

    .dual-range-input::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .dual-range-input::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #4caf82;
      cursor: ew-resize;
      pointer-events: auto;
      border: 2px solid #0f1117;
      box-shadow: 0 0 5px rgba(0,0,0,0.6);
    }

    .dual-range-input::-moz-range-thumb:hover {
      transform: scale(1.2);
    }

    /* Enum / select control row */
    .enum-control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .enum-control-row select {
      flex: 1;
    }

    /* Dialog styling for custom loader */
    dialog {
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 12px;
      color: #e0e0e0;
      padding: 1.5rem 2rem;
      width: min(480px, 90vw);
      margin: auto;
    }

    dialog::backdrop { background: rgba(0,0,0,0.7); }
    .dialog-actions { display: flex; gap: 0.75rem; margin-top: 1.25rem; }
    .btn-save { background: #4caf82; color: #000; font-weight: 600; }
    .btn-cancel { background: #2a2d3a; color: #ccc; border: 1px solid #3a3d4a; }
  </style>

  <script type="importmap">
    {
      "imports": {
        "@web-sonifier/core": "/packages/core/src/index.js",
        "@web-sonifier/tone": "/packages/tone/src/ToneSonifier.js",
        "@web-sonifier/geiger": "/packages/geiger/src/GeigerSonifier.js",
        "@web-sonifier/purr": "/packages/purr/src/PurrSonifier.js",
        "@web-sonifier/engine": "/packages/engine/src/EngineSonifier.js",
        "@web-sonifier/liquid": "/packages/liquid/src/LiquidSonifier.js",
        "@web-sonifier/mallet": "/packages/mallet/src/MalletSonifier.js",
        "@web-sonifier/drone": "/packages/drone-sonifier/src/DroneSonifier.js",
        "@web-sonifier/vosc": "/packages/vosc/src/VoscSonifier.js",
        "@web-sonifier/rain": "/packages/rain/src/index.js",
        "@web-sonifier/ocean": "/packages/ocean/src/index.js"
      }
    }
  </script>
</head>
<body>

  <h1>web-sonifier / demo <a href="https://github.com/grahamsw/web-sonifier" style="font-size: 0.8rem; color: #4caf82; text-decoration: none; margin-left: 0.5rem; vertical-align: middle;">[view source]</a></h1>

  <div class="card">
    <!-- Top Transport & Master Volume Panel -->
    <div class="transport-bar">
      <button class="btn-play" id="btn-play">▶ Play</button>
      <button class="btn-stop" id="btn-stop" disabled>■ Stop</button>
      <div class="status-badge" id="status">Stopped</div>
    </div>

    <div class="volume-row">
      <label for="master-volume">Master volume</label>
      <input type="range" id="master-volume" min="0" max="1" step="0.01" value="0.8">
      <span class="vol-value" id="master-volume-display">0.80</span>
    </div>

    <!-- Sonifier & Feed Rate Selector Panel -->
    <div class="sonifier-row">
      <div class="sonifier-select-group">
        <label for="sonifier-select">Sonifier:</label>
        <select id="sonifier-select">
          <option value="tone">Continuous Tone</option>
          <option value="geiger">Geiger Counter</option>
          <option value="purr">Purr</option>
          <option value="engine">Engine</option>
          <option value="liquid">Liquid Resonator</option>
          <option value="mallet">Mallet</option>
          <option value="drone">Drone</option>
          <option value="vosc">VOSC Player</option>
          <option value="rain">Rain</option>
          <option value="ocean">Ocean</option>
        </select>
        <button id="btn-open-load-custom" type="button" title="Load external sonifier" style="background: #2a2d3a; color: #4caf82; border: 1px solid #3a3d4a; padding: 0.35rem 0.6rem; font-size: 0.78rem; border-radius: 6px; cursor: pointer;">+ External</button>
      </div>

      <div class="feed-rate-group" id="feed-rate-group">
        <label for="feed-rate-select">Feed Rate:</label>
        <select id="feed-rate-select">
          <option value="1000">1 / sec</option>
          <option value="500">2 / sec</option>
          <option value="250">4 / sec</option>
          <option value="5000">1 / 5s</option>
          <option value="10000">1 / 10s</option>
        </select>
      </div>
    </div>

    <!-- Sonifier Parameters Panel -->
    <div class="parameters-header">
      <h2>Sonifier Parameters</h2>
      <span class="hint">Check to sonify via live feed (0–100)</span>
    </div>

    <div class="parameters-container" id="parameters-panel">
      <!-- Dynamically populated per sonifier -->
    </div>
  </div>

  <!-- External Sonifier Dialog -->
  <dialog id="custom-sonifier-dialog">
    <h2 style="font-size: 1.1rem; margin-bottom: 0.5rem; color: #fff;">Load External Sonifier</h2>
    <p style="font-size: 0.8rem; color: #888; margin-bottom: 1rem;">
      Load an ES Module from a local dev URL (e.g. <code>http://localhost:5173/index.js</code>), a relative path, or a CDN URL.
    </p>

    <div style="display: flex; flex-direction: column; gap: 0.75rem;">
      <div>
        <label style="display: block; font-size: 0.8rem; color: #aaa; margin-bottom: 0.25rem;">Module URL or Path:</label>
        <input type="text" id="custom-url-input" placeholder="http://localhost:5173/src/index.js" style="width: 100%; background: #0f1117; border: 1px solid #2a2d3a; border-radius: 6px; color: #fff; padding: 0.5rem; font-size: 0.85rem;">
      </div>

      <div style="display: flex; gap: 0.5rem;">
        <div style="flex: 1;">
          <label style="display: block; font-size: 0.8rem; color: #aaa; margin-bottom: 0.25rem;">Sonifier Name:</label>
          <input type="text" id="custom-name-input" placeholder="my-sonifier" style="width: 100%; background: #0f1117; border: 1px solid #2a2d3a; border-radius: 6px; color: #fff; padding: 0.5rem; font-size: 0.85rem;">
        </div>
        <div style="flex: 1;">
          <label style="display: block; font-size: 0.8rem; color: #aaa; margin-bottom: 0.25rem;">Export Name (optional):</label>
          <input type="text" id="custom-export-input" placeholder="Default or class name" style="width: 100%; background: #0f1117; border: 1px solid #2a2d3a; border-radius: 6px; color: #fff; padding: 0.5rem; font-size: 0.85rem;">
        </div>
      </div>

      <div>
        <label style="display: block; font-size: 0.8rem; color: #aaa; margin-bottom: 0.25rem;">Mapped Parameter (optional):</label>
        <input type="text" id="custom-mapped-param-input" placeholder="Auto-detected if empty (default: frequency)" style="width: 100%; background: #0f1117; border: 1px solid #2a2d3a; border-radius: 6px; color: #fff; padding: 0.5rem; font-size: 0.85rem;">
      </div>

      <div id="custom-load-error" style="color: #e05c5c; font-size: 0.8rem; min-height: 1.2rem;"></div>

      <div class="dialog-actions">
        <button type="button" class="btn-save" id="btn-custom-load">Load</button>
        <button type="button" class="btn-cancel" id="btn-custom-cancel">Cancel</button>
      </div>
    </div>
  </dialog>

  <script type="module" src="/demo/main.js"></script>
</body>
</html>
