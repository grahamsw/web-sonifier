<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>web-sonifier demo</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
    }

    h1 { font-size: 1.4rem; font-weight: 500; color: #fff; letter-spacing: 0.05em; }

    .card {
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 12px;
      padding: 1.5rem 2rem;
      width: 100%;
      max-width: 480px;
    }

    .price-display {
      text-align: center;
      padding: 1rem 0;
    }

    .price-display .label {
      font-size: 0.8rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .price-display .value {
      font-size: 3rem;
      font-weight: 600;
      color: #fff;
      font-variant-numeric: tabular-nums;
    }

    .price-display .change {
      font-size: 0.9rem;
      margin-top: 0.25rem;
      font-variant-numeric: tabular-nums;
    }

    .change.up   { color: #4caf82; }
    .change.down { color: #e05c5c; }

    .controls {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.25rem;
      flex-wrap: wrap;
    }

    button {
      flex: 1;
      padding: 0.6rem 1rem;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-play    { background: #4caf82; color: #000; font-weight: 600; }
    .btn-stop    { background: #444; color: #fff; }
    .btn-settings { background: #2a2d3a; color: #ccc; border: 1px solid #3a3d4a; }

    .volume-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    .volume-row label { font-size: 0.85rem; color: #888; white-space: nowrap; }

    input[type=range] {
      flex: 1;
      accent-color: #4caf82;
    }

    .volume-row .vol-value {
      font-size: 0.85rem;
      color: #ccc;
      width: 2.5rem;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    /* Settings dialog */
    dialog {
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 12px;
      color: #e0e0e0;
      padding: 1.5rem 2rem;
      width: min(480px, 90vw);
      margin: auto;
    }

    dialog::backdrop { background: rgba(0,0,0,0.7); }

    dialog h2 { font-size: 1rem; font-weight: 500; margin-bottom: 1.25rem; color: #fff; }

    .setting-group {
      margin-bottom: 1.25rem;
    }

    .setting-group h3 {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #666;
      margin-bottom: 0.75rem;
    }

    .setting-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
    }

    .setting-row label {
      font-size: 0.85rem;
      color: #aaa;
      width: 9rem;
      flex-shrink: 0;
    }

    .setting-row input[type=number] {
      width: 5rem;
      background: #0f1117;
      border: 1px solid #2a2d3a;
      border-radius: 6px;
      color: #fff;
      padding: 0.3rem 0.5rem;
      font-size: 0.85rem;
    }

    .setting-row select {
      background: #0f1117;
      border: 1px solid #2a2d3a;
      border-radius: 6px;
      color: #fff;
      padding: 0.3rem 0.5rem;
      font-size: 0.85rem;
    }

    .dialog-range-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .dialog-range-row span { font-size: 0.8rem; color: #666; }

    .dialog-actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }

    .btn-save   { background: #4caf82; color: #000; font-weight: 600; }
    .btn-cancel { background: #2a2d3a; color: #ccc; border: 1px solid #3a3d4a; }

    .status {
      font-size: 0.75rem;
      color: #555;
      text-align: center;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "@web-sonifier/core": "/packages/core/src/index.js",
        "@web-sonifier/tone": "/packages/tone/src/ToneSonifier.js",
        "@web-sonifier/geiger": "/packages/geiger/src/GeigerSonifier.js",
        "@web-sonifier/purr": "/packages/purr/src/PurrSonifier.js",
        "@web-sonifier/engine": "/packages/engine/src/EngineSonifier.js",
        "@web-sonifier/liquid": "/packages/liquid/src/LiquidSonifier.js",
        "@web-sonifier/mallet": "/packages/mallet/src/MalletSonifier.js",
        "@web-sonifier/drone": "/packages/drone-sonifier/src/DroneSonifier.js",
        "@web-sonifier/vosc": "/packages/vosc/src/VoscSonifier.js",
        "@web-sonifier/rain": "/packages/rain/src/index.js"
      }
    }
  </script>
</head>
<body>

  <h1>web-sonifier / demo <a href="https://github.com/grahamsw/web-sonifier" style="font-size: 0.8rem; color: #4caf82; text-decoration: none; margin-left: 0.5rem; vertical-align: middle;">[view source]</a></h1>

  <div class="card">
    <div class="price-display">
      <div class="label">Data Feed</div>
      <div class="value" id="price-value">—</div>
      <div class="change" id="price-change">&nbsp;</div>
    </div>

    <div class="setting-row" style="margin-bottom: 1rem; justify-content: center; gap: 1rem; flex-wrap: wrap;">
      <div>
        <label style="margin-right: 0.5rem;">Sonifier:</label>
        <select id="sonifier-select" style="background: #0f1117; border: 1px solid #2a2d3a; border-radius: 6px; color: #fff; padding: 0.3rem 0.5rem;">
          <option value="tone">Continuous Tone</option>
          <option value="geiger">Geiger Counter</option>
          <option value="purr">Purr</option>
          <option value="engine">Engine</option>
          <option value="liquid">Liquid Resonator</option>
          <option value="mallet">Mallet</option>
          <option value="drone">Drone</option>
          <option value="vosc">VOSC Player</option>
          <option value="rain">Rain</option>
        </select>
        <button id="btn-open-load-custom" type="button" title="Load external sonifier" style="background: #2a2d3a; color: #4caf82; border: 1px solid #3a3d4a; padding: 0.25rem 0.55rem; font-size: 0.78rem; border-radius: 6px; cursor: pointer; margin-left: 0.35rem;">+ External</button>
      </div>
      <div>
        <label style="margin-right: 0.5rem;">Feed Rate:</label>
        <select id="feed-rate-select" style="background: #0f1117; border: 1px solid #2a2d3a; border-radius: 6px; color: #fff; padding: 0.3rem 0.5rem;">
          <option value="1000">1 / sec</option>
          <option value="10000">1 / 10s</option>
          <option value="60000">1 / min</option>
          <option value="300000">1 / 5m</option>
        </select>
      </div>
    </div>

    <div class="controls">
      <button class="btn-play"     id="btn-play">▶ Play</button>
      <button class="btn-stop"     id="btn-stop"     disabled>■ Stop</button>
      <button class="btn-settings" id="btn-settings" disabled>⚙ Settings</button>
    </div>

    <div class="volume-row">
      <label for="master-volume">Master volume</label>
      <input type="range" id="master-volume" min="0" max="1" step="0.01" value="0.8">
      <span class="vol-value" id="master-volume-display">0.80</span>
    </div>
  </div>

  <div class="status" id="status">Press Play to start (requires user gesture for audio)</div>

  <!-- Settings dialog -->
  <dialog id="settings-dialog">
    <h2 id="settings-title">Sonifier settings</h2>

    <div class="setting-group">
      <h3>Mapping</h3>
      <div class="setting-row">
        <label>Input range (data)</label>
        <div class="dialog-range-row">
          <input type="number" id="input-min" step="0.1">
          <span>to</span>
          <input type="number" id="input-max" step="0.1">
        </div>
      </div>
      <div class="setting-row">
        <label id="output-range-label">Output range (Hz)</label>
        <div class="dialog-range-row">
          <input type="number" id="output-min" step="1">
          <span>to</span>
          <input type="number" id="output-max" step="1">
        </div>
      </div>
      <div class="setting-row">
        <label>Curve</label>
        <select id="curve-select">
          <option value="linear">Linear</option>
          <option value="exponential">Exponential</option>
          <option value="logarithmic">Logarithmic</option>
        </select>
      </div>
    </div>

    <!-- Dynamic parameters container -->
    <div id="dynamic-params-container"></div>

    <div class="dialog-actions">
      <button class="btn-save"   id="btn-save">Save</button>
      <button class="btn-cancel" id="btn-cancel">Cancel</button>
    </div>
  </dialog>

  <!-- External Sonifier Dialog -->
  <dialog id="custom-sonifier-dialog">
    <h2 style="font-size: 1.1rem; margin-bottom: 0.5rem; color: #fff;">Load External Sonifier</h2>
    <p style="font-size: 0.8rem; color: #888; margin-bottom: 1rem;">
      Load an ES Module from a local dev URL (e.g. <code>http://localhost:5173/index.js</code>), a relative path, or a CDN URL.
    </p>

    <div style="display: flex; flex-direction: column; gap: 0.75rem;">
      <div>
        <label style="display: block; font-size: 0.8rem; color: #aaa; margin-bottom: 0.25rem;">Module URL or Path:</label>
        <input type="text" id="custom-url-input" placeholder="http://localhost:5173/src/index.js" style="width: 100%; background: #0f1117; border: 1px solid #2a2d3a; border-radius: 6px; color: #fff; padding: 0.5rem; font-size: 0.85rem;">
      </div>

      <div style="display: flex; gap: 0.5rem;">
        <div style="flex: 1;">
          <label style="display: block; font-size: 0.8rem; color: #aaa; margin-bottom: 0.25rem;">Sonifier Name:</label>
          <input type="text" id="custom-name-input" placeholder="my-sonifier" style="width: 100%; background: #0f1117; border: 1px solid #2a2d3a; border-radius: 6px; color: #fff; padding: 0.5rem; font-size: 0.85rem;">
        </div>
        <div style="flex: 1;">
          <label style="display: block; font-size: 0.8rem; color: #aaa; margin-bottom: 0.25rem;">Export Name (optional):</label>
          <input type="text" id="custom-export-input" placeholder="Default or class name" style="width: 100%; background: #0f1117; border: 1px solid #2a2d3a; border-radius: 6px; color: #fff; padding: 0.5rem; font-size: 0.85rem;">
        </div>
      </div>

      <div>
        <label style="display: block; font-size: 0.8rem; color: #aaa; margin-bottom: 0.25rem;">Mapped Parameter (optional):</label>
        <input type="text" id="custom-mapped-param-input" placeholder="Auto-detected if empty (default: frequency)" style="width: 100%; background: #0f1117; border: 1px solid #2a2d3a; border-radius: 6px; color: #fff; padding: 0.5rem; font-size: 0.85rem;">
      </div>

      <div id="custom-load-error" style="color: #e05c5c; font-size: 0.8rem; min-height: 1.2rem;"></div>

      <div class="dialog-actions">
        <button type="button" class="btn-save" id="btn-custom-load">Load</button>
        <button type="button" class="btn-cancel" id="btn-custom-cancel">Cancel</button>
      </div>
    </div>
  </dialog>

  <script type="module" src="/demo/main.js"></script>
</body>
</html>
