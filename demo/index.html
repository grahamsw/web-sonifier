<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>web-sonifier demo</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 1.5rem;
      padding: 2rem 1rem 4rem 1rem;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 500;
      color: #fff;
      letter-spacing: 0.05em;
    }

    /* 2-Column Responsive Layout */
    .app-layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 1.5rem;
      width: 100%;
      max-width: 1080px;
      align-items: start;
    }

    @media (max-width: 880px) {
      .app-layout {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 14px;
      padding: 1.25rem 1.5rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .panel-header h2 {
      font-size: 0.98rem;
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.04em;
    }

    /* Data Feeds Panel */
    .btn-add-feed {
      background: #232838;
      border: 1px solid #363d54;
      color: #4caf82;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.3rem 0.65rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-add-feed:hover {
      background: #2b3246;
      border-color: #4caf82;
    }

    .feeds-container {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    /* Feed Card */
    .feed-card {
      background: #13151f;
      border: 1px solid #232635;
      border-radius: 10px;
      padding: 0.85rem 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      position: relative;
      transition: border-color 0.15s ease;
    }

    .feed-card:hover {
      border-color: #33384c;
    }

    .feed-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .feed-tag {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-weight: 600;
      font-size: 0.88rem;
      color: #fff;
    }

    .feed-badge-pill {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .feed-val-large {
      font-size: 1.15rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .feed-meter-track {
      width: 100%;
      height: 5px;
      background: #1b1e2c;
      border-radius: 3px;
      overflow: hidden;
    }

    .feed-meter-bar {
      height: 100%;
      transition: width 0.12s ease-out;
      border-radius: 3px;
    }

    .feed-controls-grid {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      font-size: 0.8rem;
      margin-top: 0.3rem;
    }

    .feed-control-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .feed-control-group label {
      color: #888;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
      min-width: 5.5rem;
    }

    .feed-control-group select {
      flex: 1;
      background: #0d0f17;
      border: 1px solid #232738;
      border-radius: 5px;
      color: #ddd;
      padding: 0.25rem 0.4rem;
      font-size: 0.8rem;
    }

    .feed-step-row {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .feed-step-row input[type=range] {
      flex: 1;
      height: 6px;
      accent-color: #4caf82;
      min-width: 80px;
    }

    .feed-step-row input[type=number] {
      width: 3.2rem;
      background: #0d0f17;
      border: 1px solid #232738;
      border-radius: 5px;
      color: #ddd;
      padding: 0.25rem 0.35rem;
      font-size: 0.8rem;
      text-align: right;
      box-sizing: border-box;
    }

    .feed-delete-btn {
      position: absolute;
      top: 0.45rem;
      right: 0.45rem;
      background: none;
      border: none;
      color: #555;
      cursor: pointer;
      font-size: 0.95rem;
      padding: 0.2rem 0.35rem;
      line-height: 1;
      border-radius: 4px;
      transition: color 0.15s ease;
    }

    .feed-delete-btn:hover {
      color: #e05c5c;
    }

    /* Feed Themes */
    .feed-theme-A .feed-badge-pill { background: #4caf82; }
    .feed-theme-A .feed-val-large { color: #4caf82; }
    .feed-theme-A .feed-meter-bar { background: #4caf82; }

    .feed-theme-B .feed-badge-pill { background: #38bdf8; }
    .feed-theme-B .feed-val-large { color: #38bdf8; }
    .feed-theme-B .feed-meter-bar { background: #38bdf8; }

    .feed-theme-C .feed-badge-pill { background: #fbbf24; }
    .feed-theme-C .feed-val-large { color: #fbbf24; }
    .feed-theme-C .feed-meter-bar { background: #fbbf24; }

    .feed-theme-D .feed-badge-pill { background: #c084fc; }
    .feed-theme-D .feed-val-large { color: #c084fc; }
    .feed-theme-D .feed-meter-bar { background: #c084fc; }

    .feed-theme-E .feed-badge-pill { background: #f472b6; }
    .feed-theme-E .feed-val-large { color: #f472b6; }
    .feed-theme-E .feed-meter-bar { background: #f472b6; }

    /* Top transport & volume bar */
    .transport-bar {
      display: flex;
      gap: 0.6rem;
      align-items: center;
      margin-bottom: 1.15rem;
    }

    button {
      padding: 0.55rem 1rem;
      border: none;
      border-radius: 8px;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-play { background: #4caf82; color: #000; font-weight: 600; flex: 1.2; }
    .btn-play:not(:disabled):hover { background: #5bc493; }
    .btn-stop { background: #333745; color: #fff; flex: 1; }
    .btn-stop:not(:disabled):hover { background: #3f4455; }

    .status-badge {
      font-size: 0.78rem;
      color: #888;
      background: #0f1117;
      border: 1px solid #2a2d3a;
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .status-badge.active {
      color: #4caf82;
      border-color: rgba(76, 175, 130, 0.4);
    }

    /* Master volume row */
    .volume-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.15rem;
      background: #13151f;
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      border: 1px solid #232635;
    }

    .volume-row label {
      font-size: 0.82rem;
      color: #888;
      white-space: nowrap;
      min-width: 5.5rem;
    }

    input[type=range] {
      flex: 1;
      accent-color: #4caf82;
      cursor: pointer;
    }

    .volume-row .vol-value {
      font-size: 0.85rem;
      color: #ccc;
      width: 2.5rem;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    /* Sonifier selector row */
    .sonifier-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #2a2d3a;
      flex-wrap: wrap;
    }

    .sonifier-select-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex: 1;
    }

    .sonifier-select-group label {
      font-size: 0.85rem;
      color: #aaa;
      white-space: nowrap;
    }

    select {
      background: #0f1117;
      border: 1px solid #2a2d3a;
      border-radius: 6px;
      color: #fff;
      padding: 0.35rem 0.6rem;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }

    select:focus {
      border-color: #4caf82;
    }

    /* Parameters section */
    .parameters-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.85rem;
    }

    .parameters-header h2 {
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.04em;
    }

    .parameters-header .hint {
      font-size: 0.75rem;
      color: #777;
    }

    .parameters-container {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    /* Individual parameter card */
    .param-card {
      background: #13151f;
      border: 1px solid #232635;
      border-radius: 10px;
      padding: 0.75rem 0.9rem;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .param-card:hover {
      border-color: #33384c;
    }

    .param-card.sonified {
      border-color: rgba(76, 175, 130, 0.35);
      background: #141822;
    }

    .param-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .param-title-group {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .param-toggle-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 500;
      color: #ddd;
      user-select: none;
    }

    .param-toggle-label input[type=checkbox] {
      accent-color: #4caf82;
      width: 1rem;
      height: 1rem;
      cursor: pointer;
    }

    /* Feed Link Dropdown in Parameter Card */
    .param-feed-link {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.78rem;
      color: #888;
    }

    .param-feed-link select {
      padding: 0.15rem 0.4rem;
      font-size: 0.76rem;
      border-radius: 4px;
      background: #0d0f17;
      border: 1px solid #232738;
      color: #4caf82;
      font-weight: 600;
    }

    .param-readouts {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      flex-wrap: wrap;
    }

    .param-feed-badge {
      background: rgba(76, 175, 130, 0.15);
      border: 1px solid rgba(76, 175, 130, 0.35);
      color: #4caf82;
      border-radius: 5px;
      padding: 0.15rem 0.45rem;
      font-size: 0.78rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .param-feed-badge.feed-theme-B {
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.35);
      color: #38bdf8;
    }
    .param-feed-badge.feed-theme-C {
      background: rgba(251, 191, 36, 0.15);
      border-color: rgba(251, 191, 36, 0.35);
      color: #fbbf24;
    }
    .param-feed-badge.feed-theme-D {
      background: rgba(192, 132, 252, 0.15);
      border-color: rgba(192, 132, 252, 0.35);
      color: #c084fc;
    }
    .param-feed-badge.feed-theme-E {
      background: rgba(244, 114, 182, 0.15);
      border-color: rgba(244, 114, 182, 0.35);
      color: #f472b6;
    }

    .param-mapped-badge {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e0e0e0;
      border-radius: 5px;
      padding: 0.15rem 0.45rem;
      font-size: 0.78rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .param-mapped-badge .mapped-label {
      color: #888;
      font-weight: 400;
      font-size: 0.7rem;
      text-transform: uppercase;
    }

    .badge-static {
      background: #0f1117;
      border: 1px solid #2a2d3a;
      color: #aaa;
      border-radius: 5px;
      padding: 0.15rem 0.45rem;
      font-size: 0.8rem;
      font-variant-numeric: tabular-nums;
    }

    .badge-range {
      background: #0f1117;
      border: 1px solid #2a2d3a;
      color: #4caf82;
      font-weight: 600;
      border-radius: 5px;
      padding: 0.15rem 0.45rem;
      font-size: 0.8rem;
      font-variant-numeric: tabular-nums;
    }

    /* Single slider wrapper */
    .single-slider-wrapper {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.15rem 0;
    }

    .single-slider-wrapper input[type=range] {
      flex: 1;
      height: 24px;
    }

    .single-slider-wrapper input[type=number] {
      width: 5rem;
      background: #0f1117;
      border: 1px solid #2a2d3a;
      border-radius: 6px;
      color: #fff;
      padding: 0.25rem 0.4rem;
      font-size: 0.85rem;
      text-align: right;
    }

    /* Dual range slider */
    .dual-range-wrapper {
      position: relative;
      width: 100%;
      height: 32px;
      display: flex;
      align-items: center;
    }

    .dual-range-track {
      position: absolute;
      left: 0;
      right: 0;
      height: 8px;
      background: #1b1e2c;
      border-radius: 4px;
      pointer-events: none;
    }

    .dual-range-progress {
      position: absolute;
      height: 100%;
      background: #4caf82;
      border-radius: 4px;
      cursor: grab;
      touch-action: none;
      pointer-events: auto;
      z-index: 2;
    }

    .dual-range-progress::before {
      content: '';
      position: absolute;
      top: -10px;
      bottom: -10px;
      left: 0;
      right: 0;
    }

    .dual-range-progress:active {
      cursor: grabbing;
      background: #5cd09c;
    }

    .dual-range-input {
      position: absolute;
      left: 0;
      right: 0;
      width: 100%;
      height: 8px;
      -webkit-appearance: none;
      background: transparent;
      pointer-events: none;
      margin: 0;
    }

    .dual-range-input::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #4caf82;
      cursor: ew-resize;
      pointer-events: auto;
      border: 2px solid #0f1117;
      box-shadow: 0 0 5px rgba(0,0,0,0.6);
      transition: transform 0.1s ease;
    }

    .dual-range-input::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .dual-range-input::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #4caf82;
      cursor: ew-resize;
      pointer-events: auto;
      border: 2px solid #0f1117;
      box-shadow: 0 0 5px rgba(0,0,0,0.6);
    }

    .dual-range-input::-moz-range-thumb:hover {
      transform: scale(1.2);
    }

    /* Enum / select control row */
    .enum-control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .enum-control-row select {
      flex: 1;
    }

    /* Parameter Grouping */
    .param-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 0.6rem;
    }

    .param-group-header {
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #7982a9;
      font-weight: 700;
      padding: 0.25rem 0.25rem 0.15rem;
      border-bottom: 1px solid #1f2334;
      margin-bottom: 0.1rem;
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    /* Unit tag */
    .param-unit-tag {
      font-size: 0.72rem;
      color: #6b7280;
      font-weight: 400;
      margin-left: 0.25rem;
    }

    /* Invert button */
    .btn-invert {
      background: #181b28;
      border: 1px solid #2a2f44;
      color: #888;
      border-radius: 4px;
      padding: 0.15rem 0.4rem;
      font-size: 0.8rem;
      line-height: 1;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-invert:hover {
      background: #23273b;
      color: #fff;
      border-color: #434a66;
    }

    .btn-invert.inverted {
      background: rgba(251, 191, 36, 0.18);
      border-color: rgba(251, 191, 36, 0.5);
      color: #fbbf24;
      font-weight: bold;
    }

    /* Discrete parameter card */
    .discrete-desc {
      font-size: 0.74rem;
      color: #71717a;
      margin-top: 0.35rem;
      line-height: 1.3;
    }

    /* Dialog styling for custom loader */
    dialog {
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 12px;
      color: #e0e0e0;
      padding: 1.5rem 2rem;
      width: min(480px, 90vw);
      margin: auto;
    }

    dialog::backdrop { background: rgba(0,0,0,0.7); }
    .dialog-actions { display: flex; gap: 0.75rem; margin-top: 1.25rem; }
    .btn-save { background: #4caf82; color: #000; font-weight: 600; }
    .btn-cancel { background: #2a2d3a; color: #ccc; border: 1px solid #3a3d4a; }
  </style>

  <script type="importmap">
    {
      "imports": {
        "@web-sonifier/core": "/packages/core/src/index.js",
        "@web-sonifier/tone": "/packages/tone/src/ToneSonifier.js",
        "@web-sonifier/geiger": "/packages/geiger/src/GeigerSonifier.js",
        "@web-sonifier/purr": "/packages/purr/src/PurrSonifier.js",
        "@web-sonifier/engine": "/packages/engine/src/EngineSonifier.js",
        "@web-sonifier/liquid": "/packages/liquid/src/LiquidSonifier.js",
        "@web-sonifier/mallet": "/packages/mallet/src/MalletSonifier.js",
        "@web-sonifier/drone": "/packages/drone-sonifier/src/DroneSonifier.js",
        "@web-sonifier/vosc": "/packages/vosc/src/VoscSonifier.js",
        "@web-sonifier/rain": "/packages/rain/src/index.js",
        "@web-sonifier/ocean": "/packages/ocean/src/index.js"
      }
    }
  </script>
</head>
<body>

  <h1>web-sonifier / demo <a href="https://github.com/grahamsw/web-sonifier" style="font-size: 0.8rem; color: #4caf82; text-decoration: none; margin-left: 0.5rem; vertical-align: middle;">[view source]</a></h1>

  <div class="app-layout">
    <!-- Left Panel: Data Feeds -->
    <div class="panel feeds-panel">
      <div class="panel-header">
        <h2>Data Feeds</h2>
        <button type="button" id="btn-add-feed" class="btn-add-feed" title="Add another data feed">+ Add Feed</button>
      </div>
      <div class="feeds-container" id="feeds-container">
        <!-- Dynamically generated feed cards (Feed A, Feed B, ...) -->
      </div>
    </div>

    <!-- Right Panel: Sonifier Console -->
    <div class="panel sonifier-panel">
      <!-- Top Transport & Master Volume Panel -->
      <div class="transport-bar">
        <button class="btn-play" id="btn-play">▶ Play</button>
        <button class="btn-stop" id="btn-stop" disabled>■ Stop</button>
        <div class="status-badge" id="status">Stopped</div>
      </div>

      <div class="volume-row">
        <label for="master-volume">Master volume</label>
        <input type="range" id="master-volume" min="0" max="1" step="0.01" value="0.8">
        <span class="vol-value" id="master-volume-display">0.80</span>
      </div>

      <!-- Sonifier Selector Panel -->
      <div class="sonifier-row">
        <div class="sonifier-select-group">
          <label for="sonifier-select">Sonifier:</label>
          <select id="sonifier-select">
            <option value="tone">Continuous Tone</option>
            <option value="geiger">Geiger Counter</option>
            <option value="purr">Purr</option>
            <option value="engine">Engine</option>
            <option value="liquid">Liquid Resonator</option>
            <option value="mallet">Mallet</option>
            <option value="drone">Drone</option>
            <option value="vosc">VOSC Player</option>
            <option value="rain">Rain</option>
            <option value="ocean">Ocean</option>
          </select>
          <button id="btn-open-load-custom" type="button" title="Load external sonifier" style="background: #2a2d3a; color: #4caf82; border: 1px solid #3a3d4a; padding: 0.35rem 0.6rem; font-size: 0.78rem; border-radius: 6px; cursor: pointer;">+ External</button>
        </div>
      </div>

      <!-- Sonifier Parameters Panel -->
      <div class="parameters-header">
        <h2>Sonifier Parameters</h2>
        <span class="hint">Check to sonify via linked feed (0–100)</span>
      </div>

      <div class="parameters-container" id="parameters-panel">
        <!-- Dynamically populated per sonifier -->
      </div>
    </div>
  </div>

  <!-- External Sonifier Dialog -->
  <dialog id="custom-sonifier-dialog">
    <h2 style="font-size: 1.1rem; margin-bottom: 0.5rem; color: #fff;">Load External Sonifier</h2>
    <p style="font-size: 0.8rem; color: #888; margin-bottom: 1rem;">
      Load an ES Module from a local dev URL (e.g. <code>http://localhost:5173/index.js</code>), a relative path, or a CDN URL.
    </p>

    <div style="display: flex; flex-direction: column; gap: 0.75rem;">
      <div>
        <label style="display: block; font-size: 0.8rem; color: #aaa; margin-bottom: 0.25rem;">Module URL or Path:</label>
        <input type="text" id="custom-url-input" placeholder="http://localhost:5173/src/index.js" style="width: 100%; background: #0f1117; border: 1px solid #2a2d3a; border-radius: 6px; color: #fff; padding: 0.5rem; font-size: 0.85rem;">
      </div>

      <div style="display: flex; gap: 0.5rem;">
        <div style="flex: 1;">
          <label style="display: block; font-size: 0.8rem; color: #aaa; margin-bottom: 0.25rem;">Sonifier Name:</label>
          <input type="text" id="custom-name-input" placeholder="my-sonifier" style="width: 100%; background: #0f1117; border: 1px solid #2a2d3a; border-radius: 6px; color: #fff; padding: 0.5rem; font-size: 0.85rem;">
        </div>
        <div style="flex: 1;">
          <label style="display: block; font-size: 0.8rem; color: #aaa; margin-bottom: 0.25rem;">Export Name (optional):</label>
          <input type="text" id="custom-export-input" placeholder="Default or class name" style="width: 100%; background: #0f1117; border: 1px solid #2a2d3a; border-radius: 6px; color: #fff; padding: 0.5rem; font-size: 0.85rem;">
        </div>
      </div>

      <div>
        <label style="display: block; font-size: 0.8rem; color: #aaa; margin-bottom: 0.25rem;">Mapped Parameter (optional):</label>
        <input type="text" id="custom-mapped-param-input" placeholder="Auto-detected if empty (default: frequency)" style="width: 100%; background: #0f1117; border: 1px solid #2a2d3a; border-radius: 6px; color: #fff; padding: 0.5rem; font-size: 0.85rem;">
      </div>

      <div id="custom-load-error" style="color: #e05c5c; font-size: 0.8rem; min-height: 1.2rem;"></div>

      <div class="dialog-actions">
        <button type="button" class="btn-save" id="btn-custom-load">Load</button>
        <button type="button" class="btn-cancel" id="btn-custom-cancel">Cancel</button>
      </div>
    </div>
  </dialog>

  <script type="module" src="/demo/main.js"></script>
</body>
</html>
